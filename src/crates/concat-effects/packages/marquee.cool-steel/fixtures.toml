# Colours in the working space: linear light, 1.0 the white of an SDR
# picture. 冷钢 is drawn in the display encoding, then taken back
# into light. The centre sample is enough: the look does not read neighbours.

[[probe]]
name = "default"
input = [0.3, 0.2, 0.12, 1]
expect = [0.28225, 0.19552, 0.12459, 1]

[[probe]]
name = "minimum"
at = "min"
input = [0.3, 0.2, 0.12, 1]
expect = [0.3, 0.2, 0.12, 1]

[[probe]]
name = "maximum"
at = "max"
input = [0.3, 0.2, 0.12, 1]
expect = [0.27417, 0.18651, 0.11391, 1]
