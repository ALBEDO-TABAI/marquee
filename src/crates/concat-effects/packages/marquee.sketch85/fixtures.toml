# Working-space probes on a flat picture: what the look renders at its
# middle pixel, checked against its card and sheet (round 8).

[[probe]]
name = "default"
input = [0.3, 0.2, 0.12, 1]
expect = [0.818359, 0.770996, 0.690918, 1]

[[probe]]
name = "minimum"
at = "min"
input = [0.3, 0.2, 0.12, 1]
expect = [0.300049, 0.199951, 0.119995, 1]

[[probe]]
name = "maximum"
at = "max"
input = [0.3, 0.2, 0.12, 1]
expect = [0.941895, 0.918945, 0.852051, 1]
