# Working-space probes. Min amount is an identity mix; default and
# maximum are what the look renders, checked against its card.

[[probe]]
name = "default"
input = [0.3, 0.2, 0.12, 1]
expect = [0.130493, 0.161865, 0.138794, 1]

[[probe]]
name = "minimum"
at = "min"
input = [0.3, 0.2, 0.12, 1]
expect = [0.300049, 0.199951, 0.119995, 1]

[[probe]]
name = "maximum"
at = "max"
input = [0.3, 0.2, 0.12, 1]
expect = [0.0240021, 0.121521, 0.16394, 1]
