format = 2

[effect]
id = "concat.adjust"
name = "Adjust"
kind = "filter"
category = "Adjust"
order = 0
intensity = "exposure"
description = "The manual colour panel every picture clip carries: exposure, tone, balance, sharpness and edge."

# Three groups, in the order the panel lists them. Colour: temperature in
# kelvin with 6500 the picture as shot, tint green to magenta, saturation
# as a signed percent. Lightness: exposure in stops of light, then
# brightness, contrast, highlights, shadows, whites and blacks as signed
# percents; the last four lift or crush their end of the curve, highlights
# and shadows the broad upper and lower halves, whites and blacks the
# narrow extremes; light (光感) bends the midtones up or down and leaves
# black and white where they were. Effects: sharpen, fade, vignette and
# grain add from zero. HSL: eight bands of hue - red, orange, yellow,
# green, cyan, blue, purple, magenta - each with its hue turned, its
# saturation and its luminance, read between neighbouring bands so a
# colour between two takes a share of each, and greys none.
# Wheels: lift, gamma and gain, each a hue to push towards and a master.
# Curves: luma, then red, green and blue.
#
# 2: drawn in light. Exposure is in true stops of light, where it scaled
# the display encoding, some 2.4 stops an EV; the rest reads as it did at
# a moderate setting, without clipping.
version = 2

