# Working-space probes. Min amount is an identity mix; default and
# maximum are what the look renders, checked against its card.

[[probe]]
name = "default"
input = [0.3, 0.2, 0.12, 1]
expect = [0.161865, 0.186279, 0.213867, 1]

[[probe]]
name = "minimum"
at = "min"
input = [0.3, 0.2, 0.12, 1]
expect = [0.3, 0.2, 0.12, 1]

[[probe]]
name = "maximum"
at = "max"
input = [0.3, 0.2, 0.12, 1]
expect = [0.107178, 0.179199, 0.277832, 1]
